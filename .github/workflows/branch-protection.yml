name: branch-protection

# PRs to master must come from dev only. Add job "Validate PR source" as a required
# status check on the master branch ruleset (Settings → Rules).

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  validate-pr-source:
    name: Validate PR source
    runs-on: ubuntu-latest
    steps:
      - name: PR must come from dev
        run: |
          echo "PR from: ${{ github.head_ref }} → ${{ github.base_ref }}"
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs to master must come from dev only (got: ${{ github.head_ref }})"
            exit 1
          fi
          echo "OK: dev → master"
